    <!-- Structured Data JSON-LD (100% SEO Compliance) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sodanapalli Rahul",
        "jobTitle": "Specialized Frontend Engineer",
        "worksFor": {
          "@type": "Organization",

        },

        ]
      }

  </head>
  <body>
    <!-- Premium Branded Intro Loader (pure CSS, visible before React mounts) -->
    <div id="intro-loader" style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F6F3EE;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
    ">
      <style>
        @keyframes loader-letter-up {
          0% { opacity: 0; transform: translateY(24px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes loader-bar-sweep {
          0% { transform: scaleX(0); transform-origin: left; }
          50% { transform: scaleX(1); transform-origin: left; }
          50.01% { transform-origin: right; }
          100% { transform: scaleX(0); transform-origin: right; }
        }
        @keyframes loader-dot-pulse {
          0%, 100% { opacity: 0.2; }
          50% { opacity: 1; }
        }
        @keyframes loader-monogram-draw {
          0% { stroke-dashoffset: 200; opacity: 0.3; }
          60% { opacity: 1; }
          100% { stroke-dashoffset: 0; opacity: 1; }
        }
        #intro-loader.hide {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      </style>

      <!-- Monogram Circle -->
      <div style="margin-bottom: 32px; position: relative;">
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
          <circle cx="36" cy="36" r="34" stroke="#E7DED4" stroke-width="1.5" />
          <circle cx="36" cy="36" r="34" stroke="#C76B37" stroke-width="1.5"
            stroke-dasharray="200" stroke-dashoffset="200" stroke-linecap="round"
            style="animation: loader-monogram-draw 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;" />
          <text x="36" y="42" text-anchor="middle" fill="#111111"
            font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="300"
            letter-spacing="2">SR</text>
        </svg>
      </div>

      <!-- Name -->
      <div style="overflow: hidden; margin-bottom: 8px;">
        <div style="
          font-family: 'Space Grotesk', system-ui, sans-serif;
          font-size: 16px;
          font-weight: 300;
          letter-spacing: 0.35em;
          text-transform: uppercase;
          color: #111111;
          animation: loader-letter-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        ">Sodanapalli Rahul</div>
      </div>

      <!-- Subtitle -->
      <div style="overflow: hidden; margin-bottom: 36px;">
        <div style="
          font-family: 'Inter', system-ui, sans-serif;
          font-size: 9px;
          font-weight: 600;
          letter-spacing: 0.25em;
          text-transform: uppercase;
          color: #8B837A;
          animation: loader-letter-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        ">Frontend Architect · React · TypeScript</div>
      </div>

      <!-- Animated Progress Bar -->
      <div style="width: 160px; height: 1.5px; background: #E7DED4; border-radius: 999px; overflow: hidden;">
        <div style="
          width: 100%;
          height: 100%;
          background: #C76B37;
          animation: loader-bar-sweep 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        "></div>
      </div>

      <!-- Loading dots -->
      <div style="
        display: flex;
        gap: 6px;
        margin-top: 24px;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #C76B37;
      ">
        <span style="animation: loader-dot-pulse 1.2s ease-in-out infinite;">L</span>
        <span style="animation: loader-dot-pulse 1.2s ease-in-out 0.1s infinite;">O</span>
        <span style="animation: loader-dot-pulse 1.2s ease-in-out 0.2s infinite;">A</span>
        <span style="animation: loader-dot-pulse 1.2s ease-in-out 0.3s infinite;">D</span>
        <span style="animation: loader-dot-pulse 1.2s ease-in-out 0.4s infinite;">I</span>
        <span style="animation: loader-dot-pulse 1.2s ease-in-out 0.5s infinite;">N</span>
        <span style="animation: loader-dot-pulse 1.2s ease-in-out 0.6s infinite;">G</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
